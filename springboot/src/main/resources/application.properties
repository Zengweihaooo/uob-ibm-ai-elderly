# Spring Boot application configuration for IBM AI Elderly Project
spring.application.name=demo

# Server Configuration
server.port=8080
server.servlet.context-path=/

# ==================== SQLite Database Configuration ====================
# SQLite database configuration - local file storage, suitable for elderly device deployment

# Database Connection
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.url=jdbc:sqlite:springboot/data/elderly_companion.db
spring.datasource.username=
spring.datasource.password=

# HikariCP Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=1

# JPA Configuration
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.community.dialect.SQLiteDialect

# Database File Management
app.database.path=springboot/data/elderly_companion.db
app.database.backup.path=springboot/data/backups/
app.database.init-schema=true

# MyBatis Configuration
mybatis.mapper-locations=classpath*:mapper/*.xml
mybatis.type-aliases-package=com.example.demo.pojo
mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# ==================== Email Configuration ====================
# SMTP Email Configuration for 163.com
spring.mail.host=smtp.163.com
spring.mail.port=465
spring.mail.username=elderapp2025@163.com
spring.mail.password=RAAvi37nyRv2dhS2
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.default-encoding=UTF-8

# Thymeleaf template configuration
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# SMS Configuration for IBM AI Elderly Project
# SMS service configuration - supports both mock and real SMS sending

# SMS service enabled (set to false to completely disable)
app.sms.enabled=true

# Mock mode setting (true=mock sending, false=real sending)
app.sms.mock=false

# SMS service provider (mock/twilio)
app.sms.provider=twilio

# Twilio configuration (used when provider=twilio)
# Note: For security, real credentials are stored in docs/keys/twilio-config.json
# How to get: Login to https://console.twilio.com/ and check Dashboard
# app.sms.twilio.account-sid=your_twilio_account_sid_here
# app.sms.twilio.auth-token=your_twilio_auth_token_here

# Twilio sender phone number (needs to be verified or purchased in Twilio console)
# Using your purchased Twilio number for production
app.sms.twilio.from-number=+447476999486

# Include SMS-specific configuration (disabled for now)
# spring.profiles.include=sms


# === Social Pet MVP ===
# Hour for morning greetings
pet.wakeupHour=8
# Default podcast time
pet.defaultPodcastTime=15:00
# Do-not-disturb start time
pet.quietHours.start=21:00
# Do-not-disturb end time
pet.quietHours.end=07:00

# Optional: Use cron for precise task scheduling
# Execute every 10 seconds (for testing)
pet.morning.cron=*/10 * * * * *
# Execute every Monday at 9:00 AM
pet.weeklyReport.cron=0 0 9 * * MON

# === AI configuration (mock by default) ===
# Enable local Mock to avoid external dependencies (true=use local rules; false=call real cloud AI, fallback to mock if not configured)
app.ai.mock=true
# Provider (currently supported: gemini)
app.ai.provider=gemini
# Gemini model (options: gemini-1.5-flash / gemini-1.5-pro etc.)
app.ai.gemini.model=gemini-1.5-flash

# Gemini API Key (optional). If provided, will use API key instead of Google service account.
# 1) Direct property (not recommended to commit real value):
# app.ai.gemini.api-key=
# 2) Or via environment variable (default name GEMINI_API_KEY):
# app.ai.gemini.api-key-env=GEMINI_API_KEY

# === PDF Export Configuration ===
# Optional: register fonts for PDF rendering to ensure consistent CJK/Unicode output offline.
# Provide one or more absolute font file paths separated by semicolons ;
# Example (Windows):
# app.export.pdf.font.paths=C:\\Windows\\Fonts\\msyh.ttc;D:\\fonts\\NotoSansSC-Regular.otf
# Optional: force page break before each H2 heading
# app.export.pdf.pagebreak.h2=false
# Optional: base URI for resolving relative resources (images/links) in HTML
# app.export.pdf.base-uri=
# Optional: TOC depth level (2 = H1/H2, 3 = H1/H2/H3)
# app.export.pdf.toc.level=2
# Optional: page margins for body and cover pages
# app.export.pdf.page.margin=20mm 16mm
# app.export.pdf.page.margin.cover=25mm 20mm
# Optional: watermark text and opacity (0..1). Leave empty to disable.
app.export.pdf.watermark.text=
app.export.pdf.watermark.opacity=0.08
# Optional: cover background image (URL or relative path)
app.export.pdf.cover.image=
# Optional: PDF security (encryption and permissions)
app.export.pdf.security.enabled=false
app.export.pdf.security.user-password=
app.export.pdf.security.owner-password=
app.export.pdf.security.allow-print=true
app.export.pdf.security.allow-copy=false
app.export.pdf.security.key-length=256

# ==================== JWT Configuration ====================
# JWT Authentication Configuration
jwt.secret=yourSuperSecretKeyForJWTTokenGenerationChangeInProduction
jwt.expiration=86400000
jwt.header=Authorization
jwt.prefix=Bearer

# ==================== Memoir Seed Data ====================
# Enable inserting a sample memoir project with segments at startup (idempotent)
app.memoir.seed.enabled=true
# Owner username for the sample project (does not need to exist as user for viewing basic list)
app.memoir.seed.owner=demo_user
# Title of the sample project (used to detect existence)
app.memoir.seed.title=Sample Life Story
# Locale for the sample project
app.memoir.seed.locale=en-GB

# ==================== Static Resource Configuration ====================
# Configure static resource locations
spring.web.resources.static-locations=classpath:/static/,classpath:/public/,file:${user.dir}/
spring.web.resources.cache.cachecontrol.no-cache=true

# ==================== AWS Cloud Configuration ====================
# AWS Service Configuration

# Database Repository Selection Configuration
# Available options: sqlitePetMoodRepository, dynamoDBPetMoodRepository
app.database.repository=sqlitePetMoodRepository

# AWS Basic Configuration
aws.region=us-east-1
aws.access-key-id=${AWS_ACCESS_KEY_ID:your-access-key-here}
aws.secret-access-key=${AWS_SECRET_ACCESS_KEY:your-secret-key-here}

# AWS S3 Configuration
aws.s3.bucket=elderly-companion-bucket
aws.s3.region=${aws.region}

# AWS DynamoDB Configuration
aws.dynamodb.table.pet-mood=pet_mood
aws.dynamodb.table.schedules=schedules
aws.dynamodb.region=${aws.region}

# AWS SES Configuration
aws.ses.region=${aws.region}
aws.ses.from-email=noreply@elderly-companion.com
aws.ses.verified-emails=${AWS_SES_VERIFIED_EMAILS:elderapp2025@163.com}

# AWS SNS Configuration
aws.sns.region=${aws.region}
aws.sns.topic.reminders=arn:aws:sns:us-east-1:328614522254:elderly-companion-health-alerts
aws.sns.topic.emergency=arn:aws:sns:us-east-1:328614522254:elderly-companion-system-notifications
aws.sns.topic.push=arn:aws:sns:us-east-1:328614522254:elderly-companion-system-notifications

# AWS Region
aws.region=us-east-1

# AWS RDS Configuration (Optional)
aws.rds.enabled=false
aws.rds.endpoint=${AWS_RDS_ENDPOINT:}
aws.rds.port=${AWS_RDS_PORT:3306}
aws.rds.database=${AWS_RDS_DATABASE:elderly_companion}
aws.rds.username=${AWS_RDS_USERNAME:}
aws.rds.password=${AWS_RDS_PASSWORD:}

# Data Synchronization Configuration
app.database.sync.enabled=false
app.database.sync.interval=300000
app.database.sync.batch-size=100

# ==================== Cloud Service Configuration ====================
# Default: Local services (no cloud)
app.cloud.enabled=false
app.cloud.provider=aws
app.cloud.fallback-to-local=true

