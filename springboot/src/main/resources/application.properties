# Spring Boot application configuration for IBM AI Elderly Project
spring.application.name=demo

# ==================== SQLite Database Configuration ====================
# SQLite数据库配置 - 本地文件存储，适合老年人设备部署

# Database Connection / 数据库连接
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.url=jdbc:sqlite:data/elderly_companion.db
spring.datasource.username=
spring.datasource.password=

# HikariCP Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=1

# JPA Configuration / JPA配置
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.community.dialect.SQLiteDialect

# Database File Management / 数据库文件管理
app.database.path=data/elderly_companion.db
app.database.backup.path=data/backups/
app.database.init-schema=true

# MyBatis Configuration
mybatis.mapper-locations=classpath*:mapper/*.xml
mybatis.type-aliases-package=com.example.demo.pojo

# ==================== Email Configuration ====================
# SMTP Email Configuration for 163.com
spring.mail.host=smtp.163.com
spring.mail.port=465
