# AWS environment-specific configuration file
# Activation: --spring.profiles.active=aws

# Enable AWS cloud services
app.cloud.enabled=true
app.cloud.provider=aws

# Use cloud database
app.database.repository=dynamoDBPetMoodRepository

# Enable data synchronization
app.database.sync.enabled=true
app.database.sync.interval=60000
app.database.sync.batch-size=50

# AWS region configuration
aws.region=us-east-1

# AWS S3 configuration
aws.s3.bucket=elderly-companion-bucket-${aws.region}

# AWS DynamoDB configuration - full cloud data storage
aws.dynamodb.table.pet-mood=pet_mood_${aws.region}
aws.dynamodb.table.schedules=schedules_${aws.region}
aws.dynamodb.table.users=users_${aws.region}
aws.dynamodb.table.health-records=health_records_${aws.region}
aws.dynamodb.table.family-contacts=family_contacts_${aws.region}
aws.dynamodb.table.important-dates=important_dates_${aws.region}
aws.dynamodb.table.memos=memos_${aws.region}
aws.dynamodb.table.podcasts=podcasts_${aws.region}
aws.dynamodb.table.emotion-companions=emotion_companions_${aws.region}
aws.dynamodb.table.chat-messages=chat_messages_${aws.region}

# AWS SNS topic configuration
aws.sns.topic.reminders=arn:aws:sns:${aws.region}:${AWS_ACCOUNT_ID}:elderly-reminders
aws.sns.topic.emergency=arn:aws:sns:${aws.region}:${AWS_ACCOUNT_ID}:elderly-emergency
aws.sns.topic.push=arn:aws:sns:${aws.region}:${AWS_ACCOUNT_ID}:elderly-push

# AWS SES configuration
aws.ses.from-email=noreply@elderly-companion.com
aws.ses.verified-emails=admin@elderly-companion.com,family@elderly-companion.com

# Logging configuration
logging.level.com.example.demo=INFO
logging.level.software.amazon.awssdk=DEBUG

# Performance configuration
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5

# Cache configuration
spring.cache.type=caffeine
spring.cache.cache-names=petMood,user,schedule,healthRecord,familyContact,importantDate,memo,podcast,emotionCompanion,chatMessage
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=300s

