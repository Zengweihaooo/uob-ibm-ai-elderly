# AWS Profile Configuration
# This file contains AWS-specific overrides
# Activation: --spring.profiles.active=aws

# Enable AWS cloud services
app.cloud.enabled=true
app.database.repository=dynamoDBPetMoodRepository
app.database.sync.enabled=true
app.database.sync.interval=60000
app.database.sync.batch-size=50

# AWS Credentials (use environment variables for security)
# Set these environment variables before starting the application:
# export AWS_ACCESS_KEY_ID=your_access_key
# export AWS_SECRET_ACCESS_KEY=your_secret_key
aws.access-key-id=${AWS_ACCESS_KEY_ID:}
aws.secret-access-key=${AWS_SECRET_ACCESS_KEY:}

# AWS SES SMTP Configuration
spring.mail.host=email-smtp.us-east-1.amazonaws.com
spring.mail.port=587
spring.mail.username=${AWS_SES_SMTP_USERNAME:}
spring.mail.password=${AWS_SES_SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust=email-smtp.us-east-1.amazonaws.com

# AWS-specific logging
logging.level.software.amazon.awssdk=DEBUG

# AWS-specific performance settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5

# AWS-specific cache settings
spring.cache.type=caffeine
spring.cache.cache-names=petMood,user,schedule,healthRecord,familyContact,importantDate,memo,podcast,emotionCompanion,chatMessage
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=300s

# AWS CloudWatch Configuration
aws.cloudwatch.namespace=ElderlyCompanion/Application
aws.cloudwatch.enabled=true
aws.cloudwatch.alarm.enabled=true

# AWS Lambda Configuration
aws.lambda.function.health-analysis=elderly-companion-health-analysis
aws.lambda.function.emergency-processing=elderly-companion-emergency-processing
aws.lambda.function.data-sync=elderly-companion-data-sync
aws.lambda.enabled=true