# AWS环境专用配置文件
# 激活方式: --spring.profiles.active=aws

# 启用AWS云服务
app.cloud.enabled=true
app.cloud.provider=aws

# 使用云端数据库
app.database.repository=dynamoDBPetMoodRepository

# 启用数据同步
app.database.sync.enabled=true
app.database.sync.interval=60000
app.database.sync.batch-size=50

# AWS区域配置
aws.region=us-east-1

# AWS S3配置
aws.s3.bucket=elderly-companion-bucket-${aws.region}

# AWS DynamoDB配置
aws.dynamodb.table.pet-mood=pet_mood_${aws.region}
aws.dynamodb.table.schedules=schedules_${aws.region}

# AWS SNS主题配置
aws.sns.topic.reminders=arn:aws:sns:${aws.region}:${AWS_ACCOUNT_ID}:elderly-reminders
aws.sns.topic.emergency=arn:aws:sns:${aws.region}:${AWS_ACCOUNT_ID}:elderly-emergency
aws.sns.topic.push=arn:aws:sns:${aws.region}:${AWS_ACCOUNT_ID}:elderly-push

# AWS SES配置
aws.ses.from-email=noreply@elderly-companion.com
aws.ses.verified-emails=admin@elderly-companion.com,family@elderly-companion.com

# 日志配置
logging.level.com.example.demo=INFO
logging.level.software.amazon.awssdk=DEBUG

# 性能配置
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5

# 缓存配置
spring.cache.type=caffeine
spring.cache.cache-names=petMood,user,schedule
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=300s

