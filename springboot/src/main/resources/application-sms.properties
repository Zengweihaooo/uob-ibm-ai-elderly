# SMS Configuration for IBM AI Elderly Project
# Twilio SMS service configuration file
# This file contains sensitive credentials and should be added to .gitignore for security

# SMS service mode setting
# true = mock mode (console output only), false = real SMS sending
app.sms.mock=false

# SMS service provider configuration
# Options: mock, twilio
app.sms.provider=twilio

# ==================== Twilio Configuration ====================
# Twilio Account Credentials
# Your Twilio Account SID - unique identifier for your account
app.sms.twilio.account-sid=${TWILIO_ACCOUNT_SID:your_account_sid_here}

# Your Twilio Auth Token - secret token for API authentication
app.sms.twilio.auth-token=${TWILIO_AUTH_TOKEN:your_auth_token_here}

# Twilio phone number for sending SMS
# This should be a Twilio verified phone number or a Twilio purchased number
# Using your purchased Twilio number
app.sms.twilio.from-number=${TWILIO_FROM_NUMBER:+15551234567}

# ==================== SMS Rate Limiting ====================
# Rate limiting configuration to prevent SMS spam
app.sms.rate-limit.enabled=true
app.sms.rate-limit.max-per-minute=10
app.sms.rate-limit.max-per-hour=50
app.sms.rate-limit.max-per-day=200

# ==================== SMS Templates ====================
# Default message templates for different types of SMS
app.sms.template.health-alert=Health Alert: {healthData} Please pay attention to your health condition promptly.
app.sms.template.emergency=Emergency: {emergencyInfo} Please handle immediately or contact relevant personnel.
app.sms.template.reminder=Gentle Reminder: {reminderMessage} Wishing you good health!
app.sms.template.general={message}

# ==================== Security Configuration ====================
# Phone number validation pattern (international format)
app.sms.phone.validation.pattern=^\\+[1-9]\\d{1,14}$

# Allowed country codes for SMS sending (comma separated)
# +1 = US/Canada, +86 = China, +44 = UK, +81 = Japan, etc.
app.sms.allowed.country.codes=+1,+86,+44,+81,+33,+49

# Maximum message length (Twilio limit is 1600 characters)
app.sms.max.message.length=160

# ==================== Logging Configuration ====================
# Enable/disable SMS sending logs
app.sms.logging.enabled=true

# Log file path for SMS records
app.sms.logging.file.path=logs/sms-history.log

# ==================== Development/Testing Settings ====================
# Test phone numbers (will always use mock mode regardless of app.sms.mock setting)
app.sms.test.phone.numbers=+15555551234,+15555555678

# Enable detailed console output for debugging
app.sms.debug.enabled=true
