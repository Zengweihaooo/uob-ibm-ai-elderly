<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 回忆录</title>
  <link rel="stylesheet" href="../styles/main.css" />
  <style>
    .container { max-width: 960px; margin: 24px auto; padding: 0 16px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial; }
    .card { background: #fff; border: 1px solid #eee; border-radius: 12px; padding: 16px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
    .row { display: grid; grid-template-columns: 1fr; gap: 16px; }
    @media (min-width: 900px) { .row { grid-template-columns: 1fr 1fr; } }
    h1 { font-size: 24px; margin: 0 0 12px; }
    h2 { font-size: 18px; margin: 0 0 12px; }
    label { display: block; font-size: 14px; color: #444; margin: 8px 0 4px; }
    input[type="text"], textarea { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
    textarea { min-height: 120px; resize: vertical; }
    .btn { display: inline-block; background: #4f46e5; color: #fff; border: none; border-radius: 8px; padding: 10px 14px; font-size: 14px; cursor: pointer; }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-secondary { background: #64748b; }
    .btn-outline { background: transparent; color: #4f46e5; border: 1px solid #4f46e5; }
    .list { list-style: none; padding: 0; margin: 0; }
    .list li { padding: 10px 8px; border-bottom: 1px solid #f0f0f0; display: flex; align-items: center; justify-content: space-between; }
    .muted { color: #666; font-size: 12px; }
    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .chip { display:inline-block; padding: 2px 8px; border-radius: 999px; background:#eef2ff; color:#3730a3; font-size:12px; margin-left:8px; }
    .danger { color:#b91c1c; }
  </style>
  <!-- 页面目标：用最小 UI 打通 /api/memoir 的项目/分段/导出全流程 -->
</head>
<body>
  <div class="container">
    <h1>📘 AI 回忆录</h1>
    <p class="muted">创建回忆录项目，按章节与主题录入文字，最后导出为 Markdown 或 PDF。</p>

    <div class="row">
      <div class="card">
        <h2>新建项目</h2>
        <label>标题</label>
        <input id="p-title" type="text" placeholder="例如：奶奶的回忆录" />
        <label>作者/所有者（可选）</label>
        <input id="p-owner" type="text" placeholder="例如：Zhang San" />
        <div style="margin-top:12px" class="toolbar">
          <button class="btn" id="create-project">创建项目</button>
          <button class="btn btn-outline" id="refresh-projects">刷新列表</button>
        </div>
      </div>

      <div class="card">
        <h2>已有项目</h2>
        <ul id="project-list" class="list"></ul>
      </div>
    </div>

    <div id="work-area" class="card" style="display:none;">
      <div style="display:flex; align-items:baseline; gap:8px; flex-wrap:wrap;">
        <h2 id="current-project-title" style="margin:0;">当前项目</h2>
        <span id="current-project-meta" class="chip"></span>
      </div>
      <div class="toolbar" style="margin-top:8px;">
        <button class="btn btn-secondary" id="export-md">导出 Markdown</button>
        <button class="btn" id="export-pdf">导出 PDF</button>
      </div>

      <hr style="margin:16px -16px; border:0; border-top:1px solid #f0f0f0;"/>

      <div class="row">
        <div>
          <h2>新增分段</h2>
          <label>章节</label>
          <input id="s-chapter" type="text" placeholder="例如：童年" />
          <label>主题</label>
          <input id="s-theme" type="text" placeholder="例如：家庭" />
          <label>正文</label>
          <textarea id="s-text" placeholder="输入这段故事…"></textarea>
          <div style="margin-top:12px" class="toolbar">
            <button class="btn" id="add-segment">添加分段</button>
          </div>
          <p class="muted">提示：可多次添加不同章节/主题的分段，导出时会按章节组织。</p>
        </div>
        <div>
          <h2>分段列表</h2>
          <ul id="segment-list" class="list"></ul>
        </div>
      </div>
    </div>

    <p class="muted">导航：本页静态路径为 <code>/pages/memoir.html</code>。</p>
  </div>

  <script>
    // 简单的 fetch 封装
    async function apiJson(url, options = {}) {
      const resp = await fetch(url, { headers: { 'Content-Type': 'application/json' }, ...options });
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      return resp.json();
    }

    // 状态
    let currentProject = null;

    // 加载项目列表
    async function loadProjects() {
      const listEl = document.getElementById('project-list');
      listEl.innerHTML = '<li class="muted">加载中…</li>';
      try {
        const data = await apiJson('/api/memoir/projects');
        const arr = Array.isArray(data) ? data : (data.items || []);
        if (!arr.length) {
          listEl.innerHTML = '<li class="muted">暂无项目</li>';
          return;
        }
        listEl.innerHTML = '';
        arr.forEach(p => {
          const li = document.createElement('li');
          const left = document.createElement('div');
          const right = document.createElement('div');
          left.innerHTML = `<strong>${escapeHtml(p.title || ('项目#' + p.id))}</strong><div class="muted">ID: ${p.id}${p.owner ? (' · ' + escapeHtml(p.owner)) : ''}</div>`;
          const btn = document.createElement('button');
          btn.className = 'btn btn-outline';
          btn.textContent = '进入';
          btn.onclick = () => openProject(p);
          right.appendChild(btn);
          li.appendChild(left);
          li.appendChild(right);
          listEl.appendChild(li);
        });
      } catch (e) {
        listEl.innerHTML = `<li class="danger">加载失败：${e.message}</li>`;
      }
    }

    // 创建项目
    async function createProject() {
      const title = document.getElementById('p-title').value.trim();
      const owner = document.getElementById('p-owner').value.trim();
      if (!title) { alert('请输入标题'); return; }
      try {
        const data = await apiJson('/api/memoir/projects', { method: 'POST', body: JSON.stringify({ title, owner }) });
        // 兼容返回结构 {projectId: n}
        if (data && (data.projectId || data.id)) {
          await loadProjects();
          document.getElementById('p-title').value = '';
          // 自动进入该项目
          openProject({ id: data.projectId || data.id, title, owner });
        } else {
          alert('创建成功，但响应格式非常规');
          loadProjects();
        }
      } catch (e) {
        alert('创建失败：' + e.message);
      }
    }

    // 打开项目
    async function openProject(p) {
      currentProject = p;
      document.getElementById('work-area').style.display = '';
      document.getElementById('current-project-title').textContent = p.title || ('项目#' + p.id);
      document.getElementById('current-project-meta').textContent = 'ID ' + p.id + (p.owner ? (' · ' + p.owner) : '');
      await loadSegments();
    }

    // 加载分段
    async function loadSegments() {
      const listEl = document.getElementById('segment-list');
      listEl.innerHTML = '<li class="muted">加载中…</li>';
      try {
        const data = await apiJson(`/api/memoir/projects/${currentProject.id}/segments`);
        const arr = Array.isArray(data) ? data : (data.items || []);
        if (!arr.length) { listEl.innerHTML = '<li class="muted">暂无分段</li>'; return; }
        listEl.innerHTML = '';
        arr.forEach(s => {
          const li = document.createElement('li');
          li.innerHTML = `<div><strong>${escapeHtml(s.chapter || '-')}</strong><span class="chip">${escapeHtml(s.theme || '-')}</span><div class=\"muted\">${escapeHtml((s.text || '').slice(0, 80))}</div></div>`;
          listEl.appendChild(li);
        });
      } catch (e) {
        listEl.innerHTML = `<li class="danger">加载失败：${e.message}</li>`;
      }
    }

    // 添加分段
    async function addSegment() {
      const chapter = document.getElementById('s-chapter').value.trim();
      const theme = document.getElementById('s-theme').value.trim();
      const text = document.getElementById('s-text').value.trim();
      if (!text) { alert('请输入正文'); return; }
      try {
        await apiJson(`/api/memoir/projects/${currentProject.id}/segments`, {
          method: 'POST',
          body: JSON.stringify({ chapter, theme, text })
        });
        document.getElementById('s-text').value = '';
        await loadSegments();
      } catch (e) {
        alert('添加失败：' + e.message);
      }
    }

    // 导出
    async function exportMemoir(fmt) {
      if (!currentProject) return;
      const url = `/api/memoir/projects/${currentProject.id}/export?format=${fmt}`;
      try {
        const resp = await fetch(url);
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        const blob = await resp.blob();
        const a = document.createElement('a');
        const fname = (currentProject.title || ('memoir-' + currentProject.id)) + (fmt === 'pdf' ? '.pdf' : '.md');
        a.href = URL.createObjectURL(blob);
        a.download = fname;
        document.body.appendChild(a);
        a.click();
        a.remove();
      } catch (e) {
        alert('导出失败：' + e.message);
      }
    }

    // 简单 HTML 转义
    function escapeHtml(s) {
      const div = document.createElement('div');
      div.textContent = s == null ? '' : String(s);
      return div.innerHTML;
    }

    // 事件绑定
    document.getElementById('create-project').addEventListener('click', createProject);
    document.getElementById('refresh-projects').addEventListener('click', loadProjects);
    document.getElementById('add-segment').addEventListener('click', addSegment);
    document.getElementById('export-md').addEventListener('click', () => exportMemoir('markdown'));
    document.getElementById('export-pdf').addEventListener('click', () => exportMemoir('pdf'));

    // 初始化
    loadProjects();
  </script>
</body>
</html>
