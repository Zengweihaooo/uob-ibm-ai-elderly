<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compose Email - AI Elderly Project</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f5f5f5;
        }

        .container {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            color: #4CAF50;
        }

        .email-form {
            display: grid;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        label {
            font-weight: bold;
            margin-bottom: 5px;
            color: #555;
        }

        input[type="email"], input[type="text"], select, textarea {
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #4CAF50;
        }

        textarea {
            min-height: 200px;
            resize: vertical;
            font-family: inherit;
        }

        .recipient-section {
            background-color: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .recipient-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 15px;
        }

        .contact-selector {
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 15px;
            background-color: white;
        }

        .contact-selector h4 {
            margin: 0 0 10px 0;
            color: #4CAF50;
        }

        .contact-list {
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid #eee;
            border-radius: 5px;
            padding: 5px;
        }

        .contact-item {
            padding: 8px;
            cursor: pointer;
            border-radius: 4px;
            transition: background-color 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .contact-item:hover {
            background-color: #f0f0f0;
        }

        .contact-item.selected {
            background-color: #e8f5e8;
            border: 1px solid #4CAF50;
        }

        .contact-info {
            flex-grow: 1;
        }

        .contact-name {
            font-weight: bold;
            color: #333;
        }

        .contact-email {
            font-size: 12px;
            color: #666;
        }

        .contact-relationship {
            font-size: 11px;
            color: #888;
            font-style: italic;
        }

        .manual-input {
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 15px;
            background-color: white;
        }

        .manual-input h4 {
            margin: 0 0 10px 0;
            color: #2196F3;
        }

        .buttons {
            display: flex;
            gap: 10px;
            justify-content: space-between;
            margin-top: 20px;
        }

        .button-group {
            display: flex;
            gap: 10px;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s;
        }

        .btn-primary {
            background-color: #4CAF50;
            color: white;
        }

        .btn-primary:hover {
            background-color: #45a049;
        }

        .btn-secondary {
            background-color: #2196F3;
            color: white;
        }

        .btn-secondary:hover {
            background-color: #1976D2;
        }

        .btn-warning {
            background-color: #ff9800;
            color: white;
        }

        .btn-warning:hover {
            background-color: #f57c00;
        }

        .message {
            padding: 15px;
            border-radius: 5px;
            margin: 10px 0;
            display: none;
        }

        .message.success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .message.info {
            background-color: #cce5ff;
            color: #004085;
            border: 1px solid #99d3ff;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background-color: #e8f5e8;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-number {
            font-size: 24px;
            font-weight: bold;
            color: #4CAF50;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #4CAF50;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .search-box {
            margin-bottom: 10px;
        }

        .add-contact-form {
            display: none;
            background-color: #f0f8ff;
            padding: 15px;
            border-radius: 5px;
            margin-top: 10px;
            border: 1px solid #b3d9ff;
        }

        .add-contact-form input {
            margin-bottom: 10px;
        }

        @media (max-width: 768px) {
            .form-row,
            .recipient-options {
                grid-template-columns: 1fr;
            }
            
            .buttons {
                flex-direction: column;
            }
            
            .button-group {
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📧 Compose Email</h1>
            <p>Send emails to your contacts or any email address</p>
        </div>

        <!-- Email Statistics -->
        <div class="stats">
            <div class="stat-card">
                <div class="stat-number" id="sentCount">0</div>
                <div>Sent</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="draftCount">0</div>
                <div>Drafts</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="failedCount">0</div>
                <div>Failed</div>
            </div>
        </div>

        <!-- Messages -->
        <div id="messageArea"></div>

        <!-- Loading Indicator -->
        <div class="loading" id="loadingIndicator">
            <div class="spinner"></div>
            <p>Sending email...</p>
        </div>

        <!-- Email Compose Form -->
        <form id="emailForm" class="email-form">
            <!-- Sender Information -->
            <div class="form-row">
                <div class="form-group">
                    <label for="fromEmail">From Email:</label>
                    <input type="email" id="fromEmail" name="fromEmail" required 
                           placeholder="your-email@example.com">
                </div>
                <div class="form-group">
                    <label for="senderName">Sender Name (Optional):</label>
                    <input type="text" id="senderName" name="senderName" 
                           placeholder="Your Name">
                </div>
            </div>

            <!-- Recipient Selection -->
            <div class="recipient-section">
                <h3>📮 Select Recipient</h3>
                <div class="recipient-options">
                    <!-- Contact Selector -->
                    <div class="contact-selector">
                        <h4>📞 From Contacts</h4>
                        <div class="search-box">
                            <input type="text" id="contactSearch" placeholder="Search contacts..." 
                                   oninput="searchContacts()">
                        </div>
                        <div class="contact-list" id="contactList">
                            <div style="text-align: center; padding: 20px; color: #666;">
                                <p>Loading contacts...</p>
                            </div>
                        </div>
                        <button type="button" onclick="toggleAddContactForm()" class="btn-secondary" style="margin-top: 10px; width: 100%;">
                            ➕ Add New Contact
                        </button>
                        
                        <!-- Add Contact Form -->
                        <div class="add-contact-form" id="addContactForm">
                            <h5>Add New Contact</h5>
                            <input type="text" id="newContactName" placeholder="Contact Name" required>
                            <input type="email" id="newContactEmail" placeholder="Contact Email" required>
                            <input type="text" id="newContactPhone" placeholder="Phone (optional)">
                            <select id="newContactRelationship">
                                <option value="">Select Relationship</option>
                                <option value="family">Family</option>
                                <option value="friend">Friend</option>
                                <option value="doctor">Doctor</option>
                                <option value="caregiver">Caregiver</option>
                                <option value="other">Other</option>
                            </select>
                            <div style="display: flex; gap: 10px; margin-top: 10px;">
                                <button type="button" onclick="addContact()" class="btn-primary" style="flex: 1;">Add</button>
                                <button type="button" onclick="toggleAddContactForm()" class="btn-secondary" style="flex: 1;">Cancel</button>
                            </div>
                        </div>
                    </div>

                    <!-- Manual Input -->
                    <div class="manual-input">
                        <h4>✍️ Manual Input</h4>
                        <input type="email" id="manualEmail" placeholder="Enter email address..." 
                               oninput="updateRecipient()">
                        <small style="color: #666; margin-top: 5px; display: block;">
                            Type any email address here
                        </small>
                    </div>
                </div>

                <!-- Selected Recipient Display -->
                <div style="margin-top: 15px; padding: 10px; background-color: #e8f5e8; border-radius: 5px;">
                    <strong>Selected Recipient: </strong>
                    <span id="selectedRecipient" style="color: #4CAF50;">None selected</span>
                </div>
            </div>

            <!-- Email Content -->
            <div class="form-group">
                <label for="subject">Subject:</label>
                <input type="text" id="subject" name="subject" required 
                       placeholder="Enter email subject">
            </div>

            <div class="form-group">
                <label for="content">Message:</label>
                <textarea id="content" name="content" required 
                          placeholder="Write your email message here..."></textarea>
            </div>

            <!-- Action Buttons -->
            <div class="buttons">
                <div class="button-group">
                    <button type="button" onclick="saveDraft()" class="btn-warning">
                        💾 Save Draft
                    </button>
                </div>
                <div class="button-group">
                    <button type="button" onclick="clearForm()" class="btn-secondary">
                        🗑️ Clear
                    </button>
                    <button type="submit" class="btn-primary">
                        📤 Send Email
                    </button>
                </div>
            </div>
        </form>
    </div>

    <script>
        // Global variables
        let contacts = [];
        let selectedContact = null;
        let currentUserId = 1; // Demo user ID - in real app, get from session

        // Initialize page
        document.addEventListener('DOMContentLoaded', function() {
            loadContacts();
            loadStats();
            setupFormSubmission();
        });

        // Setup form submission
        function setupFormSubmission() {
            document.getElementById('emailForm').addEventListener('submit', function(e) {
                e.preventDefault();
                sendEmail();
            });
        }

        // Load contacts from server
        async function loadContacts() {
            try {
                const response = await fetch(`/email/api/contacts?userId=${currentUserId}`);
                const data = await response.json();
                
                if (data.success) {
                    contacts = data.contacts;
                    displayContacts(contacts);
                } else {
                    showMessage('Failed to load contacts: ' + data.message, 'error');
                    displayContacts([]);
                }
            } catch (error) {
                console.error('Error loading contacts:', error);
                showMessage('Error loading contacts', 'error');
                displayContacts([]);
            }
        }

        // Display contacts in the list
        function displayContacts(contactsToShow) {
            const contactList = document.getElementById('contactList');
            
            if (contactsToShow.length === 0) {
                contactList.innerHTML = `
                    <div style="text-align: center; padding: 20px; color: #666;">
                        <p>No contacts found</p>
                        <small>Add contacts to quickly select recipients</small>
                    </div>
                `;
                return;
            }

            contactList.innerHTML = contactsToShow.map(contact => `
                <div class="contact-item" onclick="selectContact(${contact.id}, '${contact.email}', '${contact.name}')">
                    <div class="contact-info">
                        <div class="contact-name">${contact.name}</div>
                        <div class="contact-email">${contact.email}</div>
                        ${contact.relationship ? `<div class="contact-relationship">${contact.relationship}</div>` : ''}
                    </div>
                </div>
            `).join('');
        }

        // Search contacts
        function searchContacts() {
            const searchTerm = document.getElementById('contactSearch').value.toLowerCase();
            const filtered = contacts.filter(contact => 
                contact.name.toLowerCase().includes(searchTerm) ||
                contact.email.toLowerCase().includes(searchTerm) ||
                (contact.relationship && contact.relationship.toLowerCase().includes(searchTerm))
            );
            displayContacts(filtered);
        }

        // Select contact
        function selectContact(contactId, email, name) {
            selectedContact = { id: contactId, email: email, name: name };
            
            // Update UI
            document.querySelectorAll('.contact-item').forEach(item => {
                item.classList.remove('selected');
            });
            event.currentTarget.classList.add('selected');
            
            // Clear manual input
            document.getElementById('manualEmail').value = '';
            
            // Update recipient display
            updateRecipientDisplay(email, name);
        }

        // Update recipient from manual input
        function updateRecipient() {
            const manualEmail = document.getElementById('manualEmail').value;
            
            if (manualEmail) {
                // Clear contact selection
                selectedContact = null;
                document.querySelectorAll('.contact-item').forEach(item => {
                    item.classList.remove('selected');
                });
                
                updateRecipientDisplay(manualEmail, null);
            } else {
                updateRecipientDisplay(null, null);
            }
        }

        // Update recipient display
        function updateRecipientDisplay(email, name) {
            const display = document.getElementById('selectedRecipient');
            
            if (email) {
                if (name) {
                    display.textContent = `${name} (${email})`;
                } else {
                    display.textContent = email;
                }
                display.style.color = '#4CAF50';
            } else {
                display.textContent = 'None selected';
                display.style.color = '#999';
            }
        }

        // Toggle add contact form
        function toggleAddContactForm() {
            const form = document.getElementById('addContactForm');
            form.style.display = form.style.display === 'none' ? 'block' : 'none';
            
            if (form.style.display === 'block') {
                document.getElementById('newContactName').focus();
            }
        }

        // Add new contact
        async function addContact() {
            const name = document.getElementById('newContactName').value;
            const email = document.getElementById('newContactEmail').value;
            const phone = document.getElementById('newContactPhone').value;
            const relationship = document.getElementById('newContactRelationship').value;

            if (!name || !email) {
                showMessage('Name and email are required', 'error');
                return;
            }

            try {
                const formData = new FormData();
                formData.append('userId', currentUserId);
                formData.append('name', name);
                formData.append('email', email);
                formData.append('phone', phone);
                formData.append('relationship', relationship);

                const response = await fetch('/email/api/contacts', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (data.success) {
                    showMessage('Contact added successfully', 'success');
                    toggleAddContactForm();
                    clearAddContactForm();
                    loadContacts(); // Reload contacts
                } else {
                    showMessage('Failed to add contact: ' + data.message, 'error');
                }
            } catch (error) {
                console.error('Error adding contact:', error);
                showMessage('Error adding contact', 'error');
            }
        }

        // Clear add contact form
        function clearAddContactForm() {
            document.getElementById('newContactName').value = '';
            document.getElementById('newContactEmail').value = '';
            document.getElementById('newContactPhone').value = '';
            document.getElementById('newContactRelationship').value = '';
        }

        // Send email
        async function sendEmail() {
            const fromEmail = document.getElementById('fromEmail').value;
            const subject = document.getElementById('subject').value;
            const content = document.getElementById('content').value;
            const senderName = document.getElementById('senderName').value;

            // Get recipient
            let toEmail;
            if (selectedContact) {
                toEmail = selectedContact.email;
            } else {
                toEmail = document.getElementById('manualEmail').value;
            }

            if (!toEmail) {
                showMessage('Please select a recipient or enter an email address', 'error');
                return;
            }

            if (!fromEmail || !subject || !content) {
                showMessage('Please fill in all required fields', 'error');
                return;
            }

            // Show loading
            document.getElementById('loadingIndicator').style.display = 'block';

            try {
                const formData = new FormData();
                formData.append('fromEmail', fromEmail);
                formData.append('toEmail', toEmail);
                formData.append('subject', subject);
                formData.append('content', content);
                if (senderName) {
                    formData.append('senderName', senderName);
                }

                const response = await fetch('/email/api/send', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (data.success) {
                    showMessage('Email sent successfully to ' + toEmail, 'success');
                    clearForm();
                    loadStats(); // Refresh stats
                } else {
                    showMessage('Failed to send email: ' + data.message, 'error');
                }
            } catch (error) {
                console.error('Error sending email:', error);
                showMessage('Error sending email', 'error');
            } finally {
                document.getElementById('loadingIndicator').style.display = 'none';
            }
        }

        // Save as draft
        async function saveDraft() {
            const fromEmail = document.getElementById('fromEmail').value;
            const subject = document.getElementById('subject').value;
            const content = document.getElementById('content').value;

            let toEmail;
            if (selectedContact) {
                toEmail = selectedContact.email;
            } else {
                toEmail = document.getElementById('manualEmail').value;
            }

            try {
                const formData = new FormData();
                formData.append('fromEmail', fromEmail || '');
                formData.append('toEmail', toEmail || '');
                formData.append('subject', subject || '');
                formData.append('content', content || '');

                const response = await fetch('/email/api/draft', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (data.success) {
                    showMessage('Draft saved successfully', 'success');
                    loadStats(); // Refresh stats
                } else {
                    showMessage('Failed to save draft: ' + data.message, 'error');
                }
            } catch (error) {
                console.error('Error saving draft:', error);
                showMessage('Error saving draft', 'error');
            }
        }

        // Clear form
        function clearForm() {
            document.getElementById('emailForm').reset();
            selectedContact = null;
            document.querySelectorAll('.contact-item').forEach(item => {
                item.classList.remove('selected');
            });
            updateRecipientDisplay(null, null);
        }

        // Load statistics
        async function loadStats() {
            try {
                const response = await fetch('/email/api/stats');
                const data = await response.json();

                if (data.success) {
                    document.getElementById('sentCount').textContent = data.stats.sent || 0;
                    document.getElementById('draftCount').textContent = data.stats.draft || 0;
                    document.getElementById('failedCount').textContent = data.stats.failed || 0;
                }
            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }

        // Show message
        function showMessage(message, type) {
            const messageArea = document.getElementById('messageArea');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;
            messageDiv.textContent = message;
            messageDiv.style.display = 'block';

            messageArea.innerHTML = '';
            messageArea.appendChild(messageDiv);

            // Auto-hide after 5 seconds
            setTimeout(() => {
                messageDiv.style.display = 'none';
            }, 5000);
        }
    </script>
</body>
</html>
