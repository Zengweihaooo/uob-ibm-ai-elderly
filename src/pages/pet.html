<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Pet - UOB-IBM AI Elderly Project</title>
    <link rel="stylesheet" href="../styles/main.css">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .pet-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem 1rem 4rem; /* bottom padding for nav */
        }
        .pet-avatar {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: url('https://cdn-icons-png.flaticon.com/512/616/616408.png') center/cover no-repeat; /* placeholder avatar */
            margin-bottom: 1.5rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .greeting {
            font-size: 22px;
            font-weight: 500;
            color: var(--primary-blue);
            margin-bottom: 0.5rem;
        }
        .sub-greeting {
            font-size: 14px;
            color: var(--text-secondary);
        }

        /* Bottom navigation */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: var(--background);
            border-top: 1px solid var(--border-subtle);
            display: flex;
            justify-content: space-around;
            align-items: center;
            height: 56px;
            z-index: 1000;
        }
        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: var(--text-secondary);
            text-decoration: none;
        }
        .nav-item svg {
            width: 24px;
            height: 24px;
            margin-bottom: 2px;
            fill: currentColor;
        }
        .nav-item.active {
            color: var(--primary-blue);
        }

        /* Sections */
        .section { display: none; width: 100%; }
        .section.active { display: block; }

        /* Tasks & Medication lists */
        .list-container { width: 100%; max-width: 380px; margin: 0 auto; }
        .list-container ul { list-style: none; padding: 0; }
        .list-container li { display: flex; align-items: center; justify-content: space-between; padding: 0.5rem 0; border-bottom: 1px solid var(--border-subtle); }
        .list-container input[type="text"] { width: 70%; padding: 0.5rem; border: 1px solid var(--border-subtle); border-radius: 4px; }
        .list-container button { padding: 0.5rem 0.75rem; background: var(--primary-blue); color:#fff; border:none; border-radius:4px; font-size:14px; }

        /* Chat */
        .chat-window { width: 100%; max-width: 380px; height: 260px; border:1px solid var(--border-subtle); border-radius:6px; margin:0 auto 1rem; padding:0.5rem; overflow-y:auto; }
        .chat-message { margin: 0.25rem 0; }
        .chat-message.user { text-align:right; color:var(--primary-blue); }
        .chat-input { display:flex; gap:0.5rem; max-width: 380px; margin:0 auto; }
        .chat-input input { flex:1; padding:0.5rem; border:1px solid var(--border-subtle); border-radius:4px; }
        .chat-input button { padding:0 1rem; background:var(--primary-blue); color:#fff; border:none; border-radius:4px; }
    </style>
</head>
<body>
    <!-- top nav minimal: just home icon -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-left">
                <a href="../../index.html" class="home-btn" aria-label="Home">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M8 16V10H12V16H15V8H18L10 1L2 8H5V16H8Z" fill="currentColor"/>
                    </svg>
                </a>
                <div class="logo-container">
                    <a href="https://www.bristol.ac.uk" target="_blank" class="logo-link">
                        <img src="https://www.bristol.ac.uk/assets/responsive-web-project/2.6.0/images/logos/uob-logo.svg" alt="University of Bristol Logo" class="logo uob-logo">
                    </a>
                    <a href="https://www.ibm.com" target="_blank" class="logo-link">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/5/51/IBM_logo.svg" alt="IBM Logo" class="logo ibm-logo">
                    </a>
                </div>
            </div>
            <button class="menu-toggle" aria-label="Toggle navigation menu">
                <span></span><span></span><span></span>
            </button>
            <div class="nav-links">
                <a href="./blogs.html" class="nav-link">Blogs</a>
            </div>
        </div>
    </nav>

    <main class="pet-container">
        <!-- Calendar Section -->
        <div id="calendarSection" class="section">
            <h2 class="greeting">Calendar</h2>
            <input type="date" id="calendarDate">
            <p id="selectedDateDisplay" class="sub-greeting">Choose a date above</p>
        </div>

        <!-- Tasks Section -->
        <div id="tasksSection" class="section">
            <h2 class="greeting">Tasks</h2>
            <div class="list-container">
                <div style="display:flex; gap:0.5rem; margin-bottom:1rem;">
                    <input type="text" id="newTaskInput" placeholder="New task">
                    <button id="addTaskBtn">Add</button>
                </div>
                <ul id="taskList"></ul>
            </div>
        </div>

        <!-- Medication Section -->
        <div id="medicationSection" class="section">
            <h2 class="greeting">Medication</h2>
            <div class="list-container">
                <div style="display:flex; gap:0.5rem; margin-bottom:1rem;">
                    <input type="text" id="newMedInput" placeholder="Add medication">
                    <button id="addMedBtn">Add</button>
                </div>
                <ul id="medList"></ul>
            </div>
        </div>

        <!-- Interaction Section -->
        <div id="interactionSection" class="section">
            <div class="pet-avatar"></div>
            <div class="greeting" id="greetingText">Hello!</div>
            <div class="sub-greeting" id="subGreetingText">How can I assist you today?</div>
            <div class="chat-window" id="chatWindow"></div>
            <div class="chat-input">
                <input type="text" id="chatInput" placeholder="Type a message">
                <button id="sendChatBtn">Send</button>
            </div>
        </div>
    </main>

    <!-- Bottom navigation bar -->
    <div class="bottom-nav" id="bottomNav">
        <a href="#calendar" class="nav-item" data-item="calendar">
            <svg viewBox="0 0 24 24"><path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6c0-1.1-.9-2-2-2zm0 16H5V9h14v11z"/></svg>
            Calendar
        </a>
        <a href="#tasks" class="nav-item" data-item="tasks">
            <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5c0-1.1-.9-2-2-2zm-9 14H7v-2h3v2zm5-4H7v-2h8v2zm0-4H7V7h8v2z"/></svg>
            Tasks
        </a>
        <a href="#medication" class="nav-item" data-item="medication">
            <svg viewBox="0 0 24 24"><path d="M21 5h-6l-1-2h-4l-1 2H3c-1.1 0-2 .9-2 2v2h22V7c0-1.1-.9-2-2-2zM1 19c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V11H1v8z"/></svg>
            Medication
        </a>
        <a href="#interaction" class="nav-item" data-item="interaction">
            <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v14l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
            Interaction
        </a>
    </div>

    <script src="../index.js"></script>
    <script>
        // Simple greeting based on time
        function getGreeting() {
            const now = new Date();
            const hour = now.getHours();
            if (hour < 12) return 'Good Morning';
            else if (hour < 18) return 'Good Afternoon';
            return 'Good Evening';
        }
        document.getElementById('greetingText').textContent = getGreeting() + '!';
        document.getElementById('subGreetingText').textContent = 'I\'m your virtual companion.';

        // Sections logic
        const sectionMap = {
            calendar: document.getElementById('calendarSection'),
            tasks: document.getElementById('tasksSection'),
            medication: document.getElementById('medicationSection'),
            interaction: document.getElementById('interactionSection')
        };

        function showSection(key) {
            Object.values(sectionMap).forEach(sec => sec.classList.remove('active'));
            sectionMap[key].classList.add('active');
        }

        // default
        showSection('interaction');

        const navItems = document.querySelectorAll('.nav-item');
        navItems.forEach((item) => {
            item.addEventListener('click', function (e) {
                e.preventDefault();
                navItems.forEach(i=>i.classList.remove('active'));
                this.classList.add('active');
                const key = this.dataset.item;
                showSection(key);
            });
        });

        // Calendar interaction
        const calendarDate = document.getElementById('calendarDate');
        const dateDisplay = document.getElementById('selectedDateDisplay');
        if (calendarDate) {
            calendarDate.addEventListener('change', () => {
                dateDisplay.textContent = `Selected: ${calendarDate.value}`;
            });
        }

        // Tasks interaction
        const taskList = document.getElementById('taskList');
        document.getElementById('addTaskBtn').addEventListener('click', () => {
            const txt = document.getElementById('newTaskInput').value.trim();
            if(!txt) return;
            const li = document.createElement('li');
            li.innerHTML = `<span>${txt}</span><input type="checkbox">`;
            taskList.appendChild(li);
            document.getElementById('newTaskInput').value='';
        });

        // Medication interaction
        const medList = document.getElementById('medList');
        document.getElementById('addMedBtn').addEventListener('click', () => {
            const txt = document.getElementById('newMedInput').value.trim();
            if(!txt) return;
            const li = document.createElement('li');
            li.innerHTML = `<span>${txt}</span><input type="checkbox">`;
            medList.appendChild(li);
            document.getElementById('newMedInput').value='';
        });

        // Chat interaction (simple echo)
        const chatWindow = document.getElementById('chatWindow');
        function addChatMessage(msg, cls) {
            const div = document.createElement('div');
            div.className = `chat-message ${cls}`;
            div.textContent = msg;
            chatWindow.appendChild(div);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }
        document.getElementById('sendChatBtn').addEventListener('click', ()=>{
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if(!text) return;
            addChatMessage(text,'user');
            input.value='';
            setTimeout(()=> addChatMessage('Meow! (sample reply)','bot'),500);
        });
    </script>
</body>
</html>
