<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Pet Reminder App</title>
    <link rel="stylesheet" href="../styles/main.css">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #0f62fe;
            --primary-blue-hover: #0043ce;
            --success-green: #24a148;
            --warning-orange: #f1c21b;
            --error-red: #da1e28;
            --background: #ffffff;
            --surface: #f4f4f4;
            --text-primary: #161616;
            --text-secondary: #525252;
            --border-subtle: #e0e0e0;
            --border-strong: #8d8d8d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'IBM Plex Sans', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-container {
            background: var(--background);
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            width: 100%;
            max-width: 900px;
            display: flex;
            min-height: 600px;
        }

        .auth-sidebar {
            background: linear-gradient(135deg, var(--primary-blue) 0%, #0043ce 100%);
            color: white;
            padding: 3rem 2rem;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            text-align: center;
        }

        .auth-sidebar h2 {
            font-size: 2rem;
            margin-bottom: 1rem;
            font-weight: 500;
        }

        .auth-sidebar p {
            font-size: 1.1rem;
            opacity: 0.9;
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        .pet-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }

        .auth-main {
            flex: 1.2;
            padding: 3rem 2rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .auth-tabs {
            display: flex;
            margin-bottom: 2rem;
            background: var(--surface);
            border-radius: 8px;
            padding: 4px;
        }

        .auth-tab {
            flex: 1;
            padding: 12px 16px;
            text-align: center;
            border: none;
            background: transparent;
            cursor: pointer;
            border-radius: 6px;
            font-weight: 500;
            transition: all 0.2s ease;
            color: var(--text-secondary);
        }

        .auth-tab.active {
            background: var(--primary-blue);
            color: white;
        }

        .auth-form {
            display: none;
        }

        .auth-form.active {
            display: block;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--text-primary);
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid var(--border-subtle);
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.2s ease;
            background: var(--background);
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary-blue);
        }

        .form-group input.error {
            border-color: var(--error-red);
        }

        .btn {
            width: 100%;
            padding: 14px 16px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: 1rem;
        }

        .btn-primary {
            background: var(--primary-blue);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            background: var(--primary-blue-hover);
        }

        .btn-secondary {
            background: var(--surface);
            color: var(--text-primary);
            border: 2px solid var(--border-subtle);
        }

        .btn-secondary:hover:not(:disabled) {
            background: var(--border-subtle);
        }

        .btn-guest {
            background: var(--warning-orange);
            color: var(--text-primary);
        }

        .btn-guest:hover:not(:disabled) {
            background: #d2a106;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn.loading {
            position: relative;
            color: transparent;
        }

        .btn.loading::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 20px;
            height: 20px;
            border: 2px solid transparent;
            border-top: 2px solid currentColor;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            color: white;
        }

        @keyframes spin {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }

        .message {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 1rem;
            font-weight: 500;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .message.info {
            background: #cce5ff;
            color: #004085;
            border: 1px solid #99d3ff;
        }

        .divider {
            text-align: center;
            margin: 1.5rem 0;
            position: relative;
            color: var(--text-secondary);
        }

        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: var(--border-subtle);
        }

        .divider span {
            background: var(--background);
            padding: 0 1rem;
        }

        .verification-section {
            background: var(--surface);
            padding: 1.5rem;
            border-radius: 8px;
            margin-top: 1rem;
        }

        .verification-code {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin: 1rem 0;
        }

        .verification-code input {
            width: 50px;
            height: 50px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            border: 2px solid var(--border-subtle);
            border-radius: 8px;
        }

        .verification-code input:focus {
            border-color: var(--primary-blue);
        }

        .forgot-password {
            text-align: center;
            margin-top: 1rem;
        }

        .forgot-password a {
            color: var(--primary-blue);
            text-decoration: none;
            font-weight: 500;
        }

        .forgot-password a:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .auth-container {
                flex-direction: column;
                max-width: 400px;
            }

            .auth-sidebar {
                padding: 2rem 1rem;
                min-height: 200px;
            }

            .auth-main {
                padding: 2rem 1rem;
            }

            .pet-icon {
                font-size: 3rem;
            }

            .auth-sidebar h2 {
                font-size: 1.5rem;
            }

            .auth-sidebar p {
                font-size: 1rem;
            }
        }

        .step-indicator {
            display: flex;
            justify-content: center;
            margin-bottom: 2rem;
            gap: 1rem;
        }

        .step {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 16px;
            position: relative;
        }

        .step.active {
            background-color: var(--primary-blue);
            color: white;
        }

        .step.completed {
            background-color: var(--success-green);
            color: white;
        }

        .step.inactive {
            background-color: var(--border-subtle);
            color: var(--text-secondary);
        }

        .step::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 100%;
            width: 30px;
            height: 2px;
            background: var(--border-subtle);
            margin-left: 10px;
        }

        .step:last-child::after {
            display: none;
        }

        .step.completed::after {
            background: var(--success-green);
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <!-- 左侧信息栏 -->
        <div class="auth-sidebar">
            <div class="pet-icon">🐾</div>
            <h2>Pet Reminder App</h2>
            <p>Your AI companion for elderly care. Join our community and start caring for your virtual pet while staying connected with your loved ones.</p>
        </div>

        <!-- 右侧认证表单 -->
        <div class="auth-main">
            <!-- 标签页切换 -->
            <div class="auth-tabs">
                <button class="auth-tab active" data-tab="login">Login</button>
                <button class="auth-tab" data-tab="register">Register</button>
            </div>

            <!-- 消息显示区域 -->
            <div id="message-container"></div>

            <!-- 登录表单 -->
            <div id="login-form" class="auth-form active">
                <form id="loginForm">
                    <div class="form-group">
                        <label for="loginEmail">Email Address</label>
                        <input type="email" id="loginEmail" name="email" placeholder="Enter your email" required>
                    </div>
                    <div class="form-group">
                        <label for="loginPassword">Password</label>
                        <input type="password" id="loginPassword" name="password" placeholder="Enter your password" required>
                    </div>
                    <button type="submit" class="btn btn-primary" id="loginBtn">Sign In</button>
                </form>
                
                <div class="forgot-password">
                    <a href="#" id="forgotPasswordLink">Forgot your password?</a>
                </div>

                <div class="divider">
                    <span>or</span>
                </div>

                <button type="button" class="btn btn-guest" id="guestBtn">Continue as Guest</button>
            </div>

            <!-- 注册表单 -->
            <div id="register-form" class="auth-form">
                <!-- 步骤指示器 -->
                <div class="step-indicator">
                    <div class="step active" id="step1">1</div>
                    <div class="step inactive" id="step2">2</div>
                    <div class="step inactive" id="step3">3</div>
                </div>

                <!-- 步骤1: 邮箱注册 -->
                <div id="register-step-1" class="register-step active">
                    <form id="emailForm">
                        <div class="form-group">
                            <label for="registerEmail">Email Address</label>
                            <input type="email" id="registerEmail" name="email" placeholder="Enter your email address" required>
                        </div>
                        <button type="submit" class="btn btn-primary" id="emailBtn">Send Verification Code</button>
                    </form>
                </div>

                <!-- 步骤2: 验证码 -->
                <div id="register-step-2" class="register-step" style="display: none;">
                    <div class="verification-section">
                        <h3 style="text-align: center; margin-bottom: 1rem;">Verify Your Email</h3>
                        <p style="text-align: center; margin-bottom: 1rem; color: var(--text-secondary);">
                            We've sent a 6-digit code to <strong id="verification-email"></strong>
                        </p>
                        
                        <form id="verificationForm">
                            <div class="verification-code">
                                <input type="text" maxlength="1" class="code-input" data-index="0">
                                <input type="text" maxlength="1" class="code-input" data-index="1">
                                <input type="text" maxlength="1" class="code-input" data-index="2">
                                <input type="text" maxlength="1" class="code-input" data-index="3">
                                <input type="text" maxlength="1" class="code-input" data-index="4">
                                <input type="text" maxlength="1" class="code-input" data-index="5">
                            </div>
                            <button type="submit" class="btn btn-primary" id="verifyBtn">Verify Code</button>
                        </form>

                        <div style="text-align: center; margin-top: 1rem;">
                            <button type="button" class="btn btn-secondary" id="resendBtn">Resend Code</button>
                        </div>
                    </div>
                </div>

                <!-- 步骤3: 完成注册 -->
                <div id="register-step-3" class="register-step" style="display: none;">
                    <form id="completeForm">
                        <div class="form-group">
                            <label for="userName">Full Name</label>
                            <input type="text" id="userName" name="name" placeholder="Enter your full name" required>
                        </div>
                        <div class="form-group">
                            <label for="userPassword">Password</label>
                            <input type="password" id="userPassword" name="password" placeholder="Create a password" required>
                        </div>
                        <div class="form-group">
                            <label for="confirmPassword">Confirm Password</label>
                            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm your password" required>
                        </div>
                        <div class="form-group">
                            <label for="userRole">I am a:</label>
                            <select id="userRole" name="role" style="width: 100%; padding: 14px 16px; border: 2px solid var(--border-subtle); border-radius: 8px; font-size: 16px;">
                                <option value="ELDERLY">Elderly Person</option>
                                <option value="FAMILY">Family Member</option>
                                <option value="DOCTOR">Healthcare Provider</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary" id="completeBtn">Complete Registration</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 全局变量
        let currentStep = 1;
        let currentEmail = '';
        let isGuest = false;

        // DOM 元素
        const authTabs = document.querySelectorAll('.auth-tab');
        const authForms = document.querySelectorAll('.auth-form');
        const messageContainer = document.getElementById('message-container');

        // 标签页切换
        authTabs.forEach(tab => {
            tab.addEventListener('click', () => {
                const tabName = tab.dataset.tab;
                switchTab(tabName);
            });
        });

        function switchTab(tabName) {
            // 更新标签页状态
            authTabs.forEach(tab => {
                tab.classList.toggle('active', tab.dataset.tab === tabName);
            });

            // 更新表单显示
            authForms.forEach(form => {
                form.classList.toggle('active', form.id === `${tabName}-form`);
            });

            // 清除消息
            clearMessage();

            // 重置注册步骤
            if (tabName === 'register') {
                resetRegistrationSteps();
            }
        }

        // 消息显示函数
        function showMessage(message, type = 'info') {
            messageContainer.innerHTML = `<div class="message ${type}">${message}</div>`;
            setTimeout(() => {
                messageContainer.innerHTML = '';
            }, 5000);
        }

        function clearMessage() {
            messageContainer.innerHTML = '';
        }

        // 按钮加载状态
        function setButtonLoading(button, loading) {
            if (loading) {
                button.classList.add('loading');
                button.disabled = true;
            } else {
                button.classList.remove('loading');
                button.disabled = false;
            }
        }

        // 步骤指示器更新
        function updateStepIndicator(step) {
            for (let i = 1; i <= 3; i++) {
                const stepEl = document.getElementById(`step${i}`);
                if (i < step) {
                    stepEl.className = 'step completed';
                } else if (i === step) {
                    stepEl.className = 'step active';
                } else {
                    stepEl.className = 'step inactive';
                }
            }
        }

        // 显示注册步骤
        function showRegistrationStep(step) {
            // 隐藏所有步骤
            document.querySelectorAll('.register-step').forEach(stepEl => {
                stepEl.style.display = 'none';
            });

            // 显示当前步骤
            document.getElementById(`register-step-${step}`).style.display = 'block';
            
            // 更新步骤指示器
            updateStepIndicator(step);
            currentStep = step;
        }

        // 重置注册步骤
        function resetRegistrationSteps() {
            showRegistrationStep(1);
            currentEmail = '';
        }

        // 登录表单处理
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const loginBtn = document.getElementById('loginBtn');
            
            const formData = new FormData(e.target);
            const email = formData.get('email');
            const password = formData.get('password');

            setButtonLoading(loginBtn, true);
            clearMessage();

            try {
                const response = await fetch('http://localhost:8080/user/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: `email=${encodeURIComponent(email)}&password=${encodeURIComponent(password)}`
                });

                const result = await response.json();

                if (result.success) {
                    showMessage('Login successful! Redirecting...', 'success');
                    // 存储用户信息
                    localStorage.setItem('userEmail', email);
                    localStorage.setItem('isLoggedIn', 'true');
                    
                    // 重定向到主页面
                    setTimeout(() => {
                        window.location.href = '../../index.html';
                    }, 1500);
                } else {
                    showMessage(result.message || 'Login failed. Please check your credentials.', 'error');
                }
            } catch (error) {
                console.error('Login error:', error);
                showMessage('Network error. Please try again later.', 'error');
            } finally {
                setButtonLoading(loginBtn, false);
            }
        });

        // 邮箱注册处理
        document.getElementById('emailForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const emailBtn = document.getElementById('emailBtn');
            
            const formData = new FormData(e.target);
            const email = formData.get('email');
            currentEmail = email;

            setButtonLoading(emailBtn, true);
            clearMessage();

            try {
                const response = await fetch('http://localhost:8080/user/api/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: `email=${encodeURIComponent(email)}`
                });

                const result = await response.json();

                if (result.success) {
                    showMessage('Verification code sent to your email!', 'success');
                    document.getElementById('verification-email').textContent = email;
                    showRegistrationStep(2);
                } else {
                    showMessage(result.message || 'Registration failed. Please try again.', 'error');
                }
            } catch (error) {
                console.error('Registration error:', error);
                showMessage('Network error. Please try again later.', 'error');
            } finally {
                setButtonLoading(emailBtn, false);
            }
        });

        // 验证码输入处理
        const codeInputs = document.querySelectorAll('.code-input');
        codeInputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                const value = e.target.value;
                if (value.length === 1 && index < codeInputs.length - 1) {
                    codeInputs[index + 1].focus();
                }
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && e.target.value === '' && index > 0) {
                    codeInputs[index - 1].focus();
                }
            });
        });

        // 验证码验证处理
        document.getElementById('verificationForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const verifyBtn = document.getElementById('verifyBtn');
            
            const code = Array.from(codeInputs).map(input => input.value).join('');
            
            if (code.length !== 6) {
                showMessage('Please enter the complete 6-digit code.', 'error');
                return;
            }

            setButtonLoading(verifyBtn, true);
            clearMessage();

            try {
                const response = await fetch('http://localhost:8080/user/api/verify', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: `email=${encodeURIComponent(currentEmail)}&code=${encodeURIComponent(code)}`
                });

                const result = await response.json();

                if (result.success) {
                    showMessage('Email verified successfully!', 'success');
                    showRegistrationStep(3);
                } else {
                    showMessage(result.message || 'Invalid verification code. Please try again.', 'error');
                    // 清空验证码输入
                    codeInputs.forEach(input => input.value = '');
                    codeInputs[0].focus();
                }
            } catch (error) {
                console.error('Verification error:', error);
                showMessage('Network error. Please try again later.', 'error');
            } finally {
                setButtonLoading(verifyBtn, false);
            }
        });

        // 重发验证码
        document.getElementById('resendBtn').addEventListener('click', async () => {
            const resendBtn = document.getElementById('resendBtn');
            
            setButtonLoading(resendBtn, true);
            clearMessage();

            try {
                const response = await fetch('http://localhost:8080/user/api/resend', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: `email=${encodeURIComponent(currentEmail)}`
                });

                const result = await response.json();

                if (result.success) {
                    showMessage('New verification code sent!', 'success');
                    // 清空验证码输入
                    codeInputs.forEach(input => input.value = '');
                    codeInputs[0].focus();
                } else {
                    showMessage(result.message || 'Failed to resend code. Please try again.', 'error');
                }
            } catch (error) {
                console.error('Resend error:', error);
                showMessage('Network error. Please try again later.', 'error');
            } finally {
                setButtonLoading(resendBtn, false);
            }
        });

        // 完成注册处理
        document.getElementById('completeForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const completeBtn = document.getElementById('completeBtn');
            
            const formData = new FormData(e.target);
            const name = formData.get('name');
            const password = formData.get('password');
            const confirmPassword = formData.get('confirmPassword');
            const role = formData.get('role');

            // 验证密码
            if (password !== confirmPassword) {
                showMessage('Passwords do not match.', 'error');
                return;
            }

            if (password.length < 6) {
                showMessage('Password must be at least 6 characters long.', 'error');
                return;
            }

            setButtonLoading(completeBtn, true);
            clearMessage();

            try {
                const response = await fetch('http://localhost:8080/user/api/complete', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: `email=${encodeURIComponent(currentEmail)}&name=${encodeURIComponent(name)}&password=${encodeURIComponent(password)}&role=${encodeURIComponent(role)}`
                });

                const result = await response.json();

                if (result.success) {
                    showMessage('Registration completed successfully! You can now sign in.', 'success');
                    
                    // 存储用户信息
                    localStorage.setItem('userEmail', currentEmail);
                    localStorage.setItem('isLoggedIn', 'true');
                    
                    // 切换到登录页面或重定向
                    setTimeout(() => {
                        window.location.href = '../../index.html';
                    }, 2000);
                } else {
                    showMessage(result.message || 'Registration completion failed. Please try again.', 'error');
                }
            } catch (error) {
                console.error('Complete registration error:', error);
                showMessage('Network error. Please try again later.', 'error');
            } finally {
                setButtonLoading(completeBtn, false);
            }
        });

        // 游客模式处理
        document.getElementById('guestBtn').addEventListener('click', () => {
            showMessage('Entering guest mode...', 'info');
            
            // 设置游客模式标识
            localStorage.setItem('isGuest', 'true');
            localStorage.setItem('userEmail', 'guest@example.com');
            localStorage.removeItem('isLoggedIn');
            
            // 重定向到主页面
            setTimeout(() => {
                window.location.href = '../../index.html';
            }, 1000);
        });

        // 忘记密码处理
        document.getElementById('forgotPasswordLink').addEventListener('click', (e) => {
            e.preventDefault();
            showMessage('Password reset functionality will be available soon.', 'info');
        });
