server:
  port: 8090
spring:
  application:
    name: voice-command-service
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 10000
            readTimeout: 30000
main-project:
  service:
    url: http://localhost:8080
    timeout: 30000
email:
  service:
    url: http://localhost:8080
    timeout: 30000
ai:
  service:
    url: http://localhost:8080
    gemini:
      enabled: true
      model: gemini-pro
    voice:
      enabled: true
      language: zh-CN
openai:
  api-key: ${OPENAI_API_KEY:your-openai-api-key}
  model: gpt-3.5-turbo
  max-tokens: 1000
  temperature: 0.7
google:
  cloud:
    enabled: true  # Enable Google Cloud services
    project-id: ${GOOGLE_CLOUD_PROJECT_ID:organic-totem-467918-a5}
    # Primary key file - for AI services (Gemini, TTS, STT)
    credentials-file: ${GOOGLE_APPLICATION_CREDENTIALS:../docs/keys/organic-totem-467918-a5-d17504cd5eba.json}
    # Backup key file - for compute engine and other services
    backup-credentials-file: ${GOOGLE_BACKUP_CREDENTIALS:../docs/keys/organic-totem-467918-a5-6497b0d6925f.json}
    # AI service configuration - enable Gemini
    ai:
      enabled: true
      credentials-file: ${GOOGLE_AI_CREDENTIALS:../docs/keys/organic-totem-467918-a5-d17504cd5eba.json}
    # Speech service configuration - enable speech recognition
    speech:
      enabled: true
      language: zh-CN
      credentials-file: ${GOOGLE_SPEECH_CREDENTIALS:../docs/keys/organic-totem-467918-a5-d17504cd5eba.json}
    # TTS service configuration
    tts:
      enabled: true
      language: zh-CN
      credentials-file: ${GOOGLE_TTS_CREDENTIALS:../docs/keys/organic-totem-467918-a5-d17504cd5eba.json}
    # Compute engine configuration
    compute:
      enabled: true
      credentials-file: ${GOOGLE_COMPUTE_CREDENTIALS:../docs/keys/organic-totem-467918-a5-6497b0d6925f.json}
function:
  routing:
    email:
      enabled: true
      priority: 1
      service-url: http://localhost:8080
      controller: EmailComposeController
    schedule:
      enabled: true
      priority: 2
      service-url: http://localhost:8080
      controller: ScheduleController
    health:
      enabled: false
      priority: 3
      service-url: http://localhost:8080
      controller: HealthController
    pet:
      enabled: false
      priority: 4
      service-url: http://localhost:8080
      controller: PetController
logging:
  level:
    com.voicecommand: DEBUG
    org.springframework.cloud.openfeign: DEBUG
    root: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
